spring.application.name=taskmanager

# MySQL is the default runtime database. Use SPRING_PROFILES_ACTIVE=h2 for an
# in-memory database when you do not want to start MySQL.
spring.profiles.default=mysql

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
server.port=8081

# AI provider configuration
# Use AI_PROVIDER=grok for xAI Grok or AI_PROVIDER=ollama for local Ollama.
ai.provider=${AI_PROVIDER:grok}

# Grok AI configuration
# Set GROK_API_KEY in your environment instead of committing a real key.
# XAI_API_KEY is also accepted because xAI's official examples use that name.
grok.api.key=${GROK_API_KEY:${XAI_API_KEY:}}
grok.api.model=grok-4.3
grok.api.base-url=https://api.x.ai/v1

# Ollama AI configuration
# Start Ollama locally and pull this model before using AI_PROVIDER=ollama.
ollama.api.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.api.model=${OLLAMA_MODEL:phi3:latest}
