spring.application.name=taskmanager
spring.datasource.url=jdbc:h2:mem:taskdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=true
server.port=8081

# Gemini AI configuration
# Set GEMINI_API_KEY in your environment instead of committing a real key.
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=gemini-1.5-flash
gemini.api.base-url=https://generativelanguage.googleapis.com/v1beta
